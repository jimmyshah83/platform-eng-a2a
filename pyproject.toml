[project]
name = "platform-eng-a2a-demo"
version = "0.1.0"
description = ""

dependencies = [
    "langchain-core",
    "langchain-openai",
    "langgraph",
    "pydantic",
    "httpx",
    "python-dotenv",
    "a2a-sdk",
    "uvicorn",
    "click",
    "mcp",
    "azure-identity",
    "langchain-mcp-adapters",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/currency_exchange_demo", "src/platform_eng"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]